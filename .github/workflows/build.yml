name: Gyromovil-V1.13
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "Proyecto Android en: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Gyromovil.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Gyromovil
          path: Gyromovil.apk

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del PC
        shell: bash
        run: |
          DIR=$(dirname "$(find . -name test_ac_shm.py | head -n 1)")
          cd "$DIR"
          python -m unittest -v test_ac_shm
